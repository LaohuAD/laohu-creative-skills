<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>动画工作台</title>
    <link rel="stylesheet" href="/__workbench/cut.css" />
  </head>
  <body>
    <header>
      <h1 id="project">动画</h1>
      <div class="push"></div>
      <button id="progress" aria-expanded="false" aria-haspopup="dialog" aria-controls="review">制作进度</button>
    </header>
    <main>
      <aside id="library" aria-labelledby="library-title">
        <h2 id="library-title">素材库</h2>
        <nav class="library-tabs" aria-label="素材分类">
          <button data-tab="original">原始素材</button>
          <button data-tab="processed">处理后素材</button>
          <button data-tab="history">历史记录</button>
        </nav>
        <div id="library-body"></div>
      </aside>
      <section class="viewer" aria-label="成片预览">
        <div class="monitor" id="monitor">
          <iframe id="scene" title="当前剪辑的工程实渲" tabindex="-1"></iframe>
          <button id="play" class="preview-surface" aria-label="播放" disabled><span class="segment-icon" aria-hidden="true"></span></button>
          <button id="pick" aria-pressed="false" hidden>指认片段</button>
          <div id="outline" hidden><span></span></div>
          <div id="hitmenu" class="popup" hidden></div>
        </div>
      </section>
      <section id="dock" class="dock">
        <div class="toolbar">
          <strong>片段时间轴</strong><span class="spacer"></span><button id="back" aria-label="上一帧">‹</button
          ><button id="next" aria-label="下一帧">›</button
          ><output id="clock">00:00.00</output><span id="duration"></span>
          <div class="push"></div>
          <button id="captions">字幕与标记</button
          ><select id="zoom" aria-label="时间轴显示范围">
            <option value="30">30 秒</option>
            <option value="90">90 秒</option>
            <option value="0">全片</option>
            <option value="10">10 秒</option>
          </select>
        </div>
        <div id="scroll"><div id="tracks"></div></div>
        <div class="commands">
          <span id="selected">选择片段</span><button id="hide" disabled>隐藏</button
          ><button id="remove" disabled>移除</button><button id="audition" disabled>回放片段</button
          ><button id="undo" disabled>撤销</button><button id="redo" disabled>重做</button>
          <form id="form">
            <button type="button" id="mic" hidden aria-pressed="false">口述</button
            ><input
              id="command"
              aria-label="片段指令，可使用系统听写"
              placeholder="输入或听写指令，如「隐藏动画三号」"
              autocomplete="off"
            /><button>执行</button>
          </form>
        </div>
      </section>
    </main>
    <aside id="drawer" hidden>
      <div class="drawer-title">
        <h2 id="drawer-title">字幕与标记</h2>
        <button id="close" aria-label="关闭面板">×</button>
      </div>
      <div id="drawer-body"></div>
    </aside>
    <dialog id="review" aria-labelledby="review-title">
      <div class="review-header">
        <div><h2 id="review-title">制作进度</h2><span id="review-project"></span></div>
        <button id="review-close" aria-label="关闭制作进度" autofocus>关闭 <kbd>Esc</kbd></button>
      </div>
      <div class="review-layout">
        <nav id="review-stages" aria-label="制作步骤"></nav>
        <section id="review-detail" aria-label="当前步骤"></section>
      </div>
    </dialog>
    <div id="notice" role="status" hidden></div>
    <audio id="mix" preload="metadata"></audio><audio id="solo" preload="none"></audio>
    <script type="module" src="/__workbench/cut.js"></script>
  </body>
</html>
