<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>动画资源浏览器</title>
  <link rel="stylesheet" href="./gallery.css">
</head>
<body>
  <header class="hero">
    <p class="eyebrow">LAOHU MOTION · 人类浏览入口</p>
    <h1>动画资源浏览器</h1>
    <p class="intro">按可见形态、动作或用途筛选资源。选中稳定 ID 后，制作流程仍须读取对应的中文生产正文并核对本片适用条件。</p>
    <div class="coverage" id="coverage" aria-label="资源覆盖"></div>
  </header>

  <main>
    <section class="controls" aria-label="资源筛选">
      <label class="search-label" for="search">搜索资源</label>
      <input id="search" type="search" placeholder="名称、表现、动作、用途或稳定 ID" autocomplete="off">
      <label for="source-filter">资源来源</label>
      <select id="source-filter">
        <option value="all">全部资源</option>
        <option value="style">75 项视觉描述</option>
        <option value="atlas">Atlas 目录</option>
        <option value="motion-prompt">Motion Prompt 动作</option>
        <option value="overlay">Overlay 表达参考</option>
      </select>
      <label for="category-filter">类别</label>
      <select id="category-filter"><option value="all">全部类别</option></select>
      <label for="status-filter">可用状态</label>
      <select id="status-filter">
        <option value="all">全部状态</option>
        <option value="playable">可播放</option>
        <option value="reference">仅参考 / 无运行实现</option>
        <option value="pending">待整理或待核</option>
      </select>
      <button class="quiet-button" id="clear-filters" type="button">清空筛选</button>
    </section>

    <div class="result-heading">
      <h2 id="result-count">正在读取资源目录…</h2>
      <div class="page-controls">
        <button id="previous-page" type="button" aria-label="上一页">上一页</button>
        <span id="page-label">—</span>
        <button id="next-page" type="button" aria-label="下一页">下一页</button>
      </div>
    </div>

    <section id="status-message" class="status-message" role="status" aria-live="polite">正在连接本地统一目录…</section>
    <section id="resource-grid" class="resource-grid" aria-label="资源结果"></section>
  </main>

  <aside class="selection-dock" id="selection-dock" aria-live="polite">
    <span class="selection-label">当前选中</span>
    <code id="selected-id">尚未选择</code>
    <button id="copy-id" type="button" disabled>复制 ID</button>
    <span id="selection-feedback" class="selection-feedback">点击任一资源卡的“选中 ID”。</span>
  </aside>

  <script type="module" src="./gallery.mjs"></script>
</body>
</html>
