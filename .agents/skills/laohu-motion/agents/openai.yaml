interface:
  display_name: "laohu-motion | 老胡动画制作"
  short_description: "以导演思维把文稿、口播、录屏或实拍做成原生代码动画工程与可检查成片。"
  default_prompt: "用 $laohu-motion 按我的目标和材料策划或制作原生代码动画。先按品类与三态需求裁决方向，复杂稿件、口播或混剪先配合 laohu-analysis 拆骨定海拔、查暗坑并排 A/B-roll 分工，再用显式理论推演全片共享总纲与分场地图（零拍脑袋死数字）。逐场在轻量聚焦上下文里先裸脑盲起极薄白描初稿，再不限次数自由按需查阅本地风格、OpenMotion、动效、字体与音频库双输入否定升维（资源缺失或不合拍时绝不硬套模板，按理论与代码引擎原创补足），选定 DOM/SVG、Canvas 2D、Three.js、WebGL2、p5.js 或真实影像等最适工具栈，落成融合景别、运镜、速度、主光与剪辑情绪控制的单场独立三段式指令书；全部场次齐备后清空包袱做独立高维总审拼缝，落盘洁净 brief.md（字幕由 caption-source 接管不手抄）。围绕本地工作台先以原生代码实渲定妆关键帧与探索小样（不借 Cover 跨媒介生图）拍板冻结样式底座，再逐场放飞编写确定性 render(t) 并实渲过静动双扫疤、真看真听确认导出。"
