interface:
  display_name: "laohu-motion | 老胡动画制作"
  short_description: "把动画、口播或录屏设计为原生 showreel 代码工程和可检查成片。"
  default_prompt: "用 $laohu-motion 按我的目标和材料制作或规划动画。新建完整动画默认用本地 Motion Showreel 原生流程，旧 Remotion、production-plan、D3 和 Film 工程按原合同兼容维护。新片调用 Analysis，读取视觉资源总览和实际采用项的正文，按原八块形成唯一 brief.md。涉及关键屏显文字时，根据原稿口气和观看任务查字、试排、决定字与动作的配合，并在实渲中核对所选字体。保留无口播、无声、loop、录屏实拍混合输入与真实语音时钟；无词级时码不造词级边界。保留成熟代码与许可，常规声音显式选 file 或 none；synth、tone、layer 仅在明确授权时使用。通过本地薄入口把依赖、浏览器、TMP 和媒体放在确认的 work root，检查真实输出、确定性、静帧、连续片段、字体素材 ready 与最终媒体，并注明未试听或未通过项。"
