interface:
  display_name: "laohu-motion | 老胡动画制作"
  short_description: "把主题或口播转成可实施的镜头蓝图、工程与可检查的动画成片。"
  default_prompt: "使用 $laohu-motion 根据我的目标和材料制作、修改或规划动画。默认保留原口播和现有工程；把画面相对口播新增的信息、语义时间锚点、实际工具路线、渲染与最终媒体检查写清楚。只有需要口播同步但缺原音时，才使用设计预算并标记待对齐；明确无旁白、无声动画或界面动效按本轮目标时长与事件节奏完成，不等待原音。只有我明确选择固定画风时才读取对应内部专项：像素、水墨、白板、几何形变、扁平矢量层级或资料拼贴。我的本轮目标与材料是："
