interface:
  display_name: "laohu-assets | 老胡资产创作"
  short_description: "统筹可复用资产与同作美术，默认编译四宫格多视角视觉提示词（支持单图与参考图转制）并按授权设计声线。"
  default_prompt: "使用 $laohu-assets 按剧本、片段或已确认交接筛选、设计和修改可复用资产。先以概念美术总监视角立住鲜明视觉母题与反差质感，再守住 ID、适用范围与跨镜指纹，默认将每项视觉资产编译为一体化无缝四宫格多视角纯正向提示词（明确要单张图时输出单图，支持基于单张参考图转四宫格）；仅在明确授权时另交稳定角色或旁白声线提示词。实际生成、音频与保存操作按本轮授权执行。"
