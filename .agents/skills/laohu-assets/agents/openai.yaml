interface:
  display_name: "laohu-assets | 老胡资产创作"
  short_description: "筛选复用资产并按固定字段完善人物、场景、道具、服装、状态与界面设计。"
  default_prompt: "使用 $laohu-assets 按指定范围筛选可复用资产。正式资产明确身份、用途、主关系、色材方向和类别画幅；人物/道具默认一张 4:5 主图，场景/服装默认一张 16:9 主图，局部与额外视图只在指定识别或功能信息无法从主图辨认时增加。普通细节开放；精控只按已接受约束、复现或剧情/功能需要展开。通用任务由二级完成，只有用户明确要求对应类别工作才加载内部子级。"
