interface:
  display_name: "laohu-benchmark | 作品拆解与方法库"
  short_description: "拆解作品、分层检索本地材料与方法，交回真实创作决定。"
  default_prompt: "使用 $laohu-benchmark 深入拆解我指定的作品或创作素材；也可按当前决定分层检索本地来源材料或方法原子，读取所选详情并交回专业创作步骤。区分可见事实、机制推论、创作者自述与效果证据。没有当前项目也可做资料积累。我要求拆解并收录时，先交完整分析和包含复用场景、检索入口的具体入库方案，待我确认后保存；已有确认方案或我明确要求直接执行时沿用授权；不从热度推因果，不复制原作独特表达，不把候选说成成熟方法。"
