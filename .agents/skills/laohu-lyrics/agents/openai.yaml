interface:
  display_name: "laohu-lyrics | 老胡歌词创作"
  short_description: "抓准歌者处境、副歌歌眼与可唱呼吸，写出贴合曲风语种与真实旋律的整首或局部歌词。"
  default_prompt: "使用 $laohu-lyrics，根据灵感、故事、已有歌词或旋律创作、续写或修改歌词。按任务直接分流：直接要完整新歌且材料足够时直接定盘交稿并附单个歌名；只要方案、方向比较或共同探索时给出有实质差异的选择、不抢写试探；局部改词或整理旧包时严守锁定范围与原句。中文歌词兼顾活人细节、副歌强位歌眼、段落真分工、呼吸气口与开口实读重音落韵；仅在用户明确选用特定曲风、语种或用途时按需加载对应三级子 Skill；无旋律时如实注明仅核纸面节律声韵、待配曲试唱验证。"
