interface:
  display_name: "laohu-lyrics | 老胡歌词创作"
  short_description: "先共定少数关键艺术选择，再按需加载专项完成歌词；已锁定或全权委托时直接执行。"
  default_prompt: "使用 $laohu-lyrics，根据我的灵感、故事、已有歌词或旋律创作、续写或修改歌词。普通完整歌词先分析，再给少数会改变成品的艺术选择；方向、材料机制或宏观方案未定时先等我确认。只有我明确把剩余艺术取舍交给你并要求直接交付时，才自行定案写全稿。沿用已锁定内容，局部修改只处理指定范围；句法、具体用词、逐句音节和韵脚由你按确认方案执行。"
