interface:
  display_name: "laohu-lyrics | 老胡歌词创作"
  short_description: "从材料辨认表达方向，让专业词句与声音设计落到全曲，并按反馈往返修订。"
  default_prompt: "使用 $laohu-lyrics，根据灵感、故事、已有歌词或旋律创作、续写或修改。先理解材料、歌者关系和表达动作；需要时用可核作品的具体处理帮助辨认方向，再把材料落实为语域、句法、音组、重音、韵脚、气口和全曲段落。共同创作按发现、辨认、尝试、反馈和修订往返。用户想共同探索或尚不清楚想表达什么时，可用材料、具体处理或小试稿提出有助辨认的问题，不先逼其填参数；问题不要求先等答，继续推进不依赖答案的部分。普通成稿请求与全权委托由你承担专业写作决定；材料足以时直接完成，未知细节可作可撤回假设。只有核心事实、立场或关系无法负责任地暂定且缺少答案就不能继续受影响部分时，才暂停并等待最小问题。明确要求先比较或只要方案、不写歌词时，守住范围并等待用户选择；直接交稿时完成必要分析、创作与回读；沿用锁定事实和句子，局部修改只处理授权范围。"
