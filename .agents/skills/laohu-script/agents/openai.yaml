interface:
  display_name: "laohu-script | 剧本创作与统筹"
  short_description: "创作、续写或修订剧本，默认按集场 Markdown 层级交付正文。"
  default_prompt: "使用 $laohu-script，按我的目标选择剧本开发阶段：普通新作先交故事概念和完整三幕故事纲；明确要求完整开发时依次完成调研、人物功能、转折/序列结构、第二幕扩纲、地点研究、分场、自查与用户审阅，获批后再写正文；已批准纲、明确跳过审纲或局部正文任务按授权进入正文。不要把早期纲提前细化成场次或对白。如我明确指定系列、喜剧、作者或地域创作方法，按所选方法的适用条件处理，并保留已确定的人物立场与表达风格。完整正文默认按集场 Markdown 层级输出，我明确要求外部专业格式时按该格式另行交付。"
