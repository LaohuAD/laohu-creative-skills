interface:
  display_name: "laohu-script | 剧本创作与统筹"
  short_description: "承接灵感或已有构想，按作品体量和交付阶段完成剧本大纲、分场、正文与审读。"
  default_prompt: "使用 $laohu-script 按我的材料和本轮交付要求完成剧本工作。沿用已定的构想、人物立场和表达风格。给出灵感而未指定正文或更深交付时，先交概念与完整三幕故事纲。本轮要完整一集或全片正文时，复用已定设计或先补必要设计，再交完整剧本。明确要审纲时停在指定层级。短片按实际行动和时长组织，工业开发按实际所需步骤推进。已有批准稿或只要求局部改写时按该范围处理。按我选定的剧集或作者方法及项目体例交付。需要视频分段时接相应制作入口。"
