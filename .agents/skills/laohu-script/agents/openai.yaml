interface:
  display_name: "laohu-script | 剧本创作与统筹"
  short_description: "创作、续写或修订剧本，默认按集场 Markdown 层级交付正文。"
  default_prompt: "使用 $laohu-script，根据我的故事材料或当前剧本任务进入合适阶段；如我明确指定系列、喜剧、作者或地域创作方法，按所选方法的适用条件处理，地域作者未具名时可按材料信号选路，并保留已确定的人物立场与表达风格，创作或修改到我指定的范围；完整正文默认按集场 Markdown 层级输出，我明确要求外部专业格式时按该格式另行交付。只有我明确要求工作台导入或导出时才读当前项目 OpenAPI 并调用已暴露接口；未确认时不声称已保存或生成。"
