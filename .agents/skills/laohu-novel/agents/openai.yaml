interface:
  display_name: "laohu-novel | 小说创作"
  short_description: "创作、续写或修订小说，按需前置设计，完整正文默认用卷章 Markdown。"
  default_prompt: "使用 $laohu-novel，按我的目标创作、续写、改编或修订小说。沿用我已确认的构想和锁定项，按需处理复杂新作的时间线、核心人物和叙述设计。新作或承重结构变化先交章纲供我审阅，确认后写正文。已批准的章纲、既定续写、局部修改或我明确要求直接写正文时，按本轮范围完成。章纲默认按实际情节、观察或意识单元组织，完整正文默认按卷章 Markdown 交付，我指定外部格式时照做。需要我决定的核心取舍交我决定，保存按我的要求执行。"
