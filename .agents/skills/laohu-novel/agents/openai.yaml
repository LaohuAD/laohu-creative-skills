interface:
  display_name: "laohu-novel | 小说创作"
  short_description: "创作、续写或修订小说，默认按卷章 Markdown 层级交付正文。"
  default_prompt: "使用 $laohu-novel，按我的目标创作、续写、改编或修订小说；承接已有构想和锁定项，在开放范围内补足必要事件与叙述实现。新作或尚未批准且会改变承重结构的方案先交章纲供我审阅，确认后写正文；已批准的章纲、续写、局部修改和语言润色按本轮范围直接完成，我明确要求跳过章纲直接写正文时照做。章纲审阅阶段只交章纲；进入正文阶段只交正文。完整正文默认按卷章 Markdown 层级组织，我明确要求外部专业格式时按该格式另行交付。人物设定、背景和续接资料是写作依据，不自动拼进正文；生成不自动保存。只有我明确要求工作台导入或导出时才读当前项目 OpenAPI 并调用已暴露接口。"
