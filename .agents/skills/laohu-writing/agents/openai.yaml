interface:
  display_name: "laohu-writing | 老胡文章写作"
  short_description: "根据材料创作、整理或修改文章，并判断是否需要篇内讲解图。"
  default_prompt: "使用 $laohu-writing，从材料发现读者值得理解的判断，让正文呈现具体根据及其对本题的后果；比较时核对同一对象/条件，区分记录与推论；没有矛盾也可由准确观察、解释或体验推进，不造反转。按体裁和授权成文。完整写作时把候选图解内容转成辨认、对照或追踪任务，比较文字/表格与图文；正文独立可读不构成省图理由，仅纯复述且无实际帮助时省图；确有直接呈现、对照、追踪或必要体验作用的图调用 laohu-cover 设计，不直接生图。保留事实、来源、作者语气与已确认表达。新写或修改文章主标题/小标题时调用 laohu-title 并明确字段和数量，终稿默认以单个 Markdown 代码块在聊天交付。"
