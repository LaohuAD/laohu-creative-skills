interface:
  display_name: "laohu-writing | 老胡文章写作"
  short_description: "根据口述、稿件、零散材料或授权研究写 Markdown 文章，按需处理内部标题与解释图。"
  default_prompt: "使用 $laohu-writing，先判断输入是成稿、口述/ASR、零散材料或观点，还是经授权从零研究；确定读者所得与材料主线，校准事实范围并保留作者确认的立场、情绪和叙述视角。成熟口播里的有效判断优先原句或最小书面化。只在需要时调用内部标题方法处理文章主标题、章节标题或有材料支持的论点/总结句，不生成封面或平台标题包；解释图只在解决真实理解缺口且本轮授权插图时调用 laohu-cover，区分截图证据与概念说明。获授权生图时优先采用老胡画梦枋的即梦 CLI 接入方式，并按环境发现 dreamina 可执行入口，核对帮助/版本和账户状态，等异步任务到终态；能力缺失只暂停生图，文章和完整设计提示词继续交付。按图片实际作用和论证次序安排图文，前置策划资源和读者下一步，完整提示词独立围栏呈现，最后反向审稿并输出 Markdown。"
