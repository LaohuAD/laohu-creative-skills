name: Project Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep the member framework out of the public repository
        if: github.repository == 'LaohuAD/laohu-creative-skills'
        run: |
          if [ -n "$(git ls-files ':(glob,icase)**/universal-dream-framework.md')" ]; then
            echo "The member framework must be distributed through the private repository."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline checks and regression tests
        run: python3 tools/check_project.py --test
